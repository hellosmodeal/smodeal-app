pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: tailwind-canonical
      glob: '*.tsx'
      run: pnpm tailwind-canonical --fix --dedup --sort {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
    - name: knip
      run: pnpm knip
